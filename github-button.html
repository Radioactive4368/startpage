<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitHub and Teams</title>
<style>
  :root {
    --pink: #d9779f;
    --ink: #ffffff;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; }
  body {
    font-family: "Open Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    padding: 6px;
    display: flex; flex-direction: column; gap: 12px;
    height: auto; min-height: 100%;
  }
  .tile {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    flex: 1 0 auto;
    min-height: 130px;
    padding: 22px 26px;
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    color: var(--ink);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .tile::after {
    content: "";
    position: absolute;
    right: -50px; top: -60px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(255,255,255,.14);
    pointer-events: none;
  }
  .tile:active { transform: translateY(0); }
  .tile:focus-visible { outline: 3px solid #fff; outline-offset: -6px; }

  /* GitHub: dark */
  .github {
    background:
      radial-gradient(120% 140% at 0% 0%, rgba(217,119,159,.85) 0%, rgba(217,119,159,0) 55%),
      linear-gradient(120deg, #2b2f36 0%, #11131a 100%);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(255,255,255,.18);
  }
  .github::after { background: rgba(255,255,255,.08); }
  .github .go { color: #15181d; }
  .github:hover, .github:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255,255,255,.3);
  }

  /* Teams: purple */
  .teams {
    background:
      radial-gradient(120% 140% at 0% 0%, rgba(217,119,159,.85) 0%, rgba(217,119,159,0) 55%),
      linear-gradient(120deg, #7b83eb 0%, #464eb8 100%);
    box-shadow: 0 6px 18px rgba(70, 78, 184, .35), inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .teams .go { color: #464eb8; }
  .teams:hover, .teams:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(70, 78, 184, .48), inset 0 0 0 1px rgba(255,255,255,.4);
  }

  .icon {
    flex: none;
    width: 64px; height: 64px;
    border-radius: 16px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.22);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
  }
  .github .icon { background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
  .icon svg { width: 34px; height: 34px; }

  .text { position: relative; z-index: 1; min-width: 0; }
  h1 {
    margin: 0 0 4px;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 700;
    letter-spacing: -.01em;
    line-height: 1.15;
    text-shadow: 0 1px 2px rgba(0,0,0,.18);
  }
  p { margin: 0; font-size: 14px; opacity: .92; }

  .go {
    position: relative; z-index: 1;
    margin-left: auto;
    flex: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: #fff;
    transition: transform .18s ease;
  }
  .go svg { width: 20px; height: 20px; }
  .tile:hover .go, .tile:focus-visible .go { transform: translateX(3px); }

  @media (max-width: 340px) {
    .icon { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile, .go { transition: none; }
  }
</style>
</head>
<body>
  <a class="tile github" href="https://github.com" target="_blank" rel="noopener noreferrer" aria-label="Open GitHub in a new tab">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="#fff">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53
          .63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07
          -1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12
          0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27
          1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15
          0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2
          0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
    </span>
    <span class="text">
      <h1>Open GitHub</h1>
      <p>Sign in or view your repositories</p>
    </span>
    <span class="go" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </span>
  </a>

  <!-- Opens the Teams desktop app straight on the Assignments app (no target, so the page stays put) -->
  <a class="tile teams" href="msteams://teams.microsoft.com/l/entity/66aeee93-507d-479a-a3ef-8f494af43945/classroom" rel="noopener noreferrer" aria-label="Open Teams Assignments in the Teams app">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="13" height="14" rx="2.5"/>
        <path d="M7 9.5h5M9.5 9.5V15"/>
        <circle cx="18.5" cy="8.5" r="2.2"/>
        <path d="M17 13h3.5a1.5 1.5 0 0 1 1.5 1.5V17a2.5 2.5 0 0 1-2.5 2.5H18"/>
      </svg>
    </span>
    <span class="text">
      <h1>Teams Assignments</h1>
      <p>Open your homework in the Teams app</p>
    </span>
    <span class="go" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </span>
  </a>
</body>
</html>
