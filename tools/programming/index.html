body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;padding:8px}
a{color:inherit;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.list{display:grid;gap:6px}
.card{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:9px 11px;min-height:56px;border-radius:14px;
background:radial-gradient(120% 150% at 0 0,#c4719b 0%,transparent 48%),linear-gradient(135deg,#2fb3b3,#3068c4);box-shadow:0 2px 8px #0003}
.card:before{content:"";position:absolute;right:-26px;top:-34px;width:92px;height:92px;border-radius:50%;background:#ffffff22}
.card:hover{filter:brightness(1.08)}.card:focus-visible,.back:focus-visible{outline:3px solid #fff;outline-offset:2px}
.dark{background:radial-gradient(120% 150% at 0 0,#a0587f 0%,transparent 48%),linear-gradient(135deg,#2a2c32,#101116)}
.q{flex-direction:column;justify-content:center;text-align:center;gap:3px;min-height:58px;padding:7px 6px}
.q .t{font-size:12px}.q .i{font-size:18px}
.ico{flex:none;width:34px;height:34px;border-radius:10px;background:#ffffff33;border:1px solid #ffffff4d;display:grid;place-items:center;font-size:17px;position:relative}
.txt{flex:1;min-width:0;position:relative}.t{font-weight:700;font-size:14px;line-height:1.2}.s{font-size:11px;opacity:.88;margin-top:2px}
.go{flex:none;width:24px;height:24px;border-radius:50%;background:#fff;color:#2b5bc4;display:grid;place-items:center;font-size:13px;font-weight:700;position:relative}
.row{min-height:42px;padding:7px 11px}.row .t{font-size:13px}
.head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:700;font-size:15px;color:#16324f}
.back{width:28px;height:28px;border-radius:50%;background:#fff;color:#2b5bc4;display:grid;place-items:center;font-weight:700;box-shadow:0 1px 4px #0003}
.wide{grid-column:1/-1}.ico svg{width:19px;height:19px}.q .i{display:grid;place-items:center}.q .i svg{width:22px;height:22px}.go svg,.back svg{width:14px;height:14px}.back svg{width:15px;height:15px}
.cat{padding:clamp(16px,6vh,56px) 12px}.cat::before{content:"";position:fixed;inset:0;z-index:-1;background:url(../bg.jpg) center/cover no-repeat,linear-gradient(135deg,#d77fa6,#3bb6b6,#2a4f9a)}.cat .head,.cat .list{width:100%;max-width:520px;margin-left:auto;margin-right:auto}.cat .head{justify-content:center;font-size:clamp(18px,4.5vw,24px);margin-bottom:14px}.cat .row{min-height:50px}.cat .row .t{font-size:15px}
